[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "knowledge-capture"
version = "0.1.0"
description = "Crawl documentation sites and emit AI-friendly Markdown bundles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Knowledge Capture Authors" }]
keywords = ["scraping", "documentation", "markdown", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "httpx[http2]>=0.27",
    "trafilatura>=1.12",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "diskcache>=5.6",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
llm = ["openai>=1.30"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
kcap = "knowledge_capture.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/knowledge-capture"
Issues = "https://github.com/your-org/knowledge-capture/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_capture"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "SIM103"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
